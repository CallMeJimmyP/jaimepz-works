<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio QR Code Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #0f172a;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .subtitle {
            color: #475569;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .qr-wrapper {
            background: #f9fafb;
            border: 2px dashed #e5e7eb;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 350px;
        }

        #qrcode {
            background: white;
            padding: 20px;
            border-radius: 12px;
        }

        #qrcode img {
            display: block;
        }

        .url-section {
            margin-bottom: 30px;
        }

        .url-label {
            display: block;
            color: #6b7280;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .url-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: 'Courier New', monospace;
            color: #0f172a;
            background: #f9fafb;
            margin-bottom: 12px;
        }

        .url-input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .button {
            flex: 1;
            min-width: 120px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .button.primary {
            background: #4f46e5;
            color: white;
        }

        .button.primary:hover {
            background: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.2);
        }

        .button.secondary {
            background: white;
            color: #4f46e5;
            border: 2px solid #4f46e5;
        }

        .button.secondary:hover {
            background: #eef2ff;
            transform: translateY(-2px);
        }

        .info-box {
            background: #f0fdf4;
            border-left: 4px solid #22c55e;
            padding: 16px;
            border-radius: 8px;
            text-align: left;
            margin-bottom: 20px;
        }

        .info-box p {
            color: #166534;
            font-size: 0.9rem;
            margin: 0;
        }

        .footer-note {
            color: #9ca3af;
            font-size: 0.85rem;
            margin-top: 20px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .qr-wrapper {
                padding: 20px;
                min-height: 300px;
            }

            .button-group {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Portfolio QR Code</h1>
        <p class="subtitle">Scan to visit your portfolio instantly</p>

        <div class="info-box">
            <p>✓ QR code is live and ready to share. Scan with any phone camera or QR code app.</p>
        </div>

        <div class="url-section">
            <label class="url-label">Portfolio URL</label>
            <input 
                type="text" 
                class="url-input" 
                id="urlInput" 
                value="https://callmejimmyp.github.io/jaimepz-works/" 
                readonly
            >
        </div>

        <div class="qr-wrapper">
            <div id="qrcode"></div>
        </div>

        <div class="button-group">
            <button class="button primary" onclick="downloadQR()">Download QR Code</button>
            <button class="button secondary" onclick="copyURL()">Copy URL</button>
        </div>

        <p class="footer-note">
            💡 Use this QR code on business cards, resumes, or social media to share your portfolio instantly.
        </p>
    </div>

    <script>
        // Generate QR code on page load
        window.addEventListener('load', function() {
            const portfolioUrl = 'https://callmejimmyp.github.io/jaimepz-works/';
            
            // Clear previous QR code
            document.getElementById('qrcode').innerHTML = '';
            
            // Generate new QR code
            new QRCode(document.getElementById('qrcode'), {
                text: portfolioUrl,
                width: 300,
                height: 300,
                colorDark: '#0f172a',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.H
            });
        });

        // Download QR code as image
        function downloadQR() {
            const canvas = document.querySelector('#qrcode canvas');
            if (canvas) {
                const link = document.createElement('a');
                link.download = 'portfolio-qr-code.png';
                link.href = canvas.toDataURL();
                link.click();
            }
        }

        // Copy URL to clipboard
        function copyURL() {
            const urlInput = document.getElementById('urlInput');
            urlInput.select();
            document.execCommand('copy');
            
            // Provide visual feedback
            const button = event.target;
            const originalText = button.textContent;
            button.textContent = '✓ Copied!';
            button.style.background = '#10b981';
            
            setTimeout(() => {
                button.textContent = originalText;
                button.style.background = 'white';
            }, 2000);
        }
    </script>
</body>
</html>
